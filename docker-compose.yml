services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harbor
      POSTGRES_DB: harbor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: harbor
      MINIO_ROOT_PASSWORD: harbor-local-dev
    ports:
      - "9000:9000"
      - "9001:9001  "
    volumes:
      - minio-data:/data

volumes:
  pgdata:
  minio-data: